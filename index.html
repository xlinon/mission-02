<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bilbo+Swash+Caps&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link  href= "styles.css" rel="stylesheet"></link>
    <script src="script.js" defer></script>
    <title>Ralph's Financial status</title>
</head>
<body>
    <header>
        <h1>Finance Dashboard</h1>
    </header>
    <nav>
        <ul>
            <li class="nav-links"><a href="#">Expense</a></li>
            <li class="nav-links"><a href="#">Income</a></li>
            <li class="nav-links"><a href="#">Finance Breakdown</a></li>
        </ul>
    </nav>
    <main>
        <section id="balance">
            <div id="available-balance">
                <h1>$<span id="total-balance">0</span></h2>
                <h2>Available Balance</h2>
            </div>
            <div id="latest">
                <p>Latest Income: $<span id="latest-income">0</span></p>
                <p>Latest Expense: $<span id="latest-expense">0</span></p>
            </div>
        </section>
        <section id="history">
            <form id="log-history">
                <input type="number" id="amount-input" required>
                <select name="type" id="type" placeholder="type" reqiured>
                    <option value="expense">Expense</option>
                    <option value="income">Income</option>
                </select>
                <button id="add-btn">+</button>

            </form>
            <ul id="history-list">
            </ul>
        </section>
        <section id="wellbeing">
            <h2 id="afford">This is a cry for help!</h2>
        </section>
        <section id="cards">
            <h2>Card</h2>
            <div class="credit-card"><img src="img/creditcard.png"></div>
        </section>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bilbo+Swash+Caps&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link  href= "styles.css" rel="stylesheet"></link>
    <script src="script.js" defer></script>
    <title>Ralph's Financial status</title>
</head>
<body>
    <header>
        <h1>Finance Dashboard</h1>
    </header>
    <nav>
        <ul>
            <li class="nav-links"><a class="#">Expense</a></li>
            <li class="nav-links"><a class="#">Income</a></li>
            <li class="nav-links"><a class="#">Finance Breakdown</a></li>
        </ul>
    </nav>
    <main>
        <section id="balance">
            <h2>Total Balance: $<span id="total-balance">0</span></h2>
            <p>Latest Income: $<span id="latest-income">0</span></p>
            <p>Latest Expense: $<span id="latest-expense">0</span></p>
        </section>
        <section id="history">
            <form id="log-history">
                <input type="number" id="amount-input">
                <select name="type" id="type" placeholder="type">
                    <option value="expense">Expense</option>
                    <option value="income">Satisfactory</option>
                </select>
                <button id="add-btn">+</button>

            </form>
            <ul>
                <li><span class="amount">0</span></li>
            </ul>
        </section>
        <section id="wellbeing">
            <h2>You can afford a <span id="afford">PIE</span></h2>
        </section>
    </main>
</body>
</html>
